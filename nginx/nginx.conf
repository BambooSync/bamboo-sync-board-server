upstream bamboo_backend {
    # ip_hash hỗ trợ sticky session cho HTTP handshake ban đầu của WebSocket
    ip_hash;
    server server:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name localhost;

    # Kích thước tối đa của body request (10MB)
    client_max_body_size 10M;

    # Bật nén Gzip tối ưu băng thông
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Header bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. Định tuyến WebSocket cho Socket.IO
    location /socket.io/ {
        proxy_pass http://bamboo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối WebSocket liên tục 24h
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Định tuyến API REST thông thường
    location / {
        proxy_pass http://bamboo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
