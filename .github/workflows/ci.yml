name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  lint-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10


    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bamboo
          POSTGRES_PASSWORD: bamboo123
          POSTGRES_DB: bamboosyncboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://bamboo:bamboo123@localhost:5432/bamboosyncboard?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci_test_access_secret_key_123456789
      JWT_REFRESH_SECRET: ci_test_refresh_secret_key_123456789
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma validate

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Apply Database Migrations
        run: pnpm prisma migrate deploy

      - name: Compile TypeScript (Build)
        run: pnpm run build

      - name: Run Unit Tests
        run: pnpm run test

      - name: Run E2E Integration Tests
        run: pnpm run test:e2e

  docker-build:
    name: Docker Image Build Test
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: bamboosync-server:${{ github.sha }}
